services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travianz-web-v2
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      - db
    networks:
      - travianz-network-v2
    restart: unless-stopped

  db:
    image: mariadb:latest
    container_name: travianz-db-v2
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-rootpassword}}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-${MYSQL_DATABASE:-travian}}
      MARIADB_USER: ${MARIADB_USER:-${MYSQL_USER:-travianz}}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-${MYSQL_PASSWORD:-travianzpass}}
    volumes:
      - db-data-v2:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - travianz-network-v2
    restart: unless-stopped
    command: --sql_mode=""

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: travianz-phpmyadmin-v2
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-rootpassword}}
    ports:
      - "8083:80"
    depends_on:
      - db
    networks:
      - travianz-network-v2
    restart: unless-stopped

volumes:
  db-data-v2:
    driver: local

networks:
  travianz-network-v2:
    driver: bridge
